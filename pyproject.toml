[project]
name = "plataforma-distribucion-perecederos"
version = "0.1.0"
description = "Prototipo de IA para rutas de reparto y flota mínima de IA DELIVERY SL"
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# Errores de sintaxis y pyflakes (nombres sin definir, imports sin usar...).
select = ["E9", "F"]
